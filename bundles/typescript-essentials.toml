summary = "The OCX TypeScript quality set — standards for Node CLIs, published packages, browser SPAs and editor extension hosts, plus the tsconfig strictness floor and manifest policy"
keywords = "typescript,quality,review,standards,types,async,errors,exit-codes,security,modules,testing,eslint,biome,tsconfig,package.json,nodenext,publint,attw,node,browser,vscode"
description = "Everything an agent needs to write and review TypeScript the way the OCX family does: the type-aware lint gate that most repositories never actually wire, sixteen merge-blocking non-negotiables, twelve depth files covering types, async, errors, the CLI exit-code and stream contract, resources, modules and resolution, security, testing, observability, browser SPAs and the editor extension host — plus the tsconfig strictness floor per project shape, version-gated compiler flags, and the manifest and publish-verification rules for a package that ships a bin."
license = "Apache-2.0"
repository = "https://github.com/ocx-sh/grimoire-lore"

# Members are same-directory relative: this catalog publishes flat under
# ghcr.io/ocx-sh/lore/<name>, so `./typescript-quality` resolves against
# wherever the bundle itself was pulled from — a mirror keeps working.
#
# MEMBERS CARRY NO TAG. Not a digest, not an exact version, not a floating
# major, not `latest` — `latest` is a tag like any other and naming it is still
# a pin. A bundle is a *set*, not a snapshot: its job is to say "these belong
# together", and the consumer's own `grimoire.lock` is what freezes them.
#
# Do not pass --pin when releasing this bundle.

[rules]
typescript-quality = "./typescript-quality"
typescript-packaging = "./typescript-packaging"
