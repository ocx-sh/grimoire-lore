# Every tool this repository needs is pinned in `ocx.toml` and resolved through
# `ocx run <tool> -- <argv>`, so a contributor and CI run the same version of
# ruff and the same version of uv. Nothing here reaches for a floating release
# or expects a tool to be on PATH already — that is the whole point of pinning.
#
#     ocx run task -- task            # list what is available
#     ocx run task -- task verify     # everything the CI gate runs
version: "3"

silent: true

vars:
  # The scripts declare `requires-python = ">=3.11"` in their PEP 723 headers.
  # Running the floor is what makes that declaration true rather than
  # aspirational: newer-only syntax fails here, not at a consumer.
  PY: python3

tasks:
  default:
    desc: List the available tasks
    cmds:
      - ocx run task -- task --list

  lint:
    desc: Lint every Python file with the pinned ruff
    cmds:
      - ocx run ruff -- ruff check --output-format {{.RUFF_FORMAT | default "concise"}} .

  lint:fix:
    desc: Apply ruff's safe fixes
    cmds:
      - ocx run ruff -- ruff check --fix .

  format:
    desc: Format every Python file
    cmds:
      - ocx run ruff -- ruff format .

  format:check:
    desc: Fail when a Python file is not formatted
    cmds:
      - ocx run ruff -- ruff format --check .

  test:
    desc: Run the Python test suite (stdlib unittest, no runner to install)
    cmds:
      - "{{.PY}} -m unittest discover -s tests {{.UNITTEST_ARGS}}"

  # The validator also carries its own `--self-test`, which needs nothing
  # installed. It can regress while the suite above still passes, so it is a
  # separate gate rather than a step inside it.
  selftest:
    desc: Run the validator's own self-test
    cmds:
      - "{{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --self-test"

  artifacts:
    desc: Validate the rules and bundle against the artifact contract
    cmds:
      # `--root` must point at a repository that actually contains the language
      # being checked: this catalog holds no Rust, so glob liveness is
      # meaningless against `.` and every scoped rule would read as dead.
      #
      # ONE root cannot serve a polyglot catalog. `../ocx` carries Rust and the
      # Python harnesses, but no TypeScript at all — validating the TS rules
      # against it reports every one of their globs as dead. The TypeScript set
      # is deliberately checked against the *fleet* root instead, because its
      # globs span shapes no single repository has: `.tsx` lives only in the
      # React app, `.mts` only in a VitePress site, `biome.jsonc` only in the
      # one Biome repo. An extension glob for the language itself cannot be a
      # typo, so a narrower root would only manufacture findings.
      #
      # CI has no consumer checked out. Rather than fail or — worse — quietly
      # pass a check that never ran, drop only the glob check and say so.
      #
      # `--allow-absent '**/clippy.toml'`: the glob is correct and load-bearing
      # — rust-cargo.md tells you to KEEP a workspace-root clippy.toml and two
      # of its verifications read it — but `../ocx` declares its lints in
      # Cargo.toml and so has none. Deleting the glob would stop the rule
      # loading on the file it instructs you to create. One declared exception
      # keeps liveness real for the other four globs, which do resolve.
      - |
        if [ -d "{{.CONSUMER}}" ]; then
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --root {{.CONSUMER}} --allow-absent '**/clippy.toml' --allow-absent '**/rust-toolchain' --allow-absent '**/.clippy.toml' --allow-absent '**/.rustfmt.toml' --allow-absent '**/.cargo/config' --allow-absent '**/ruff.toml' --allow-absent '**/.ruff.toml' rules/rust-quality.md rules/rust-cargo.md rules/python-quality.md rules/python-packaging.md .claude/skills/research-lang
        else
          echo "note: no consumer at {{.CONSUMER}} — glob liveness NOT checked for rust/python; run locally against a Rust repo"
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py rules/rust-quality.md rules/rust-cargo.md rules/python-quality.md rules/python-packaging.md .claude/skills/research-lang
        fi
      #
      # CSS is checked WITHOUT a root, deliberately. No single tree — not this
      # repo, not the fleet — carries Less, Stylus, Svelte, `.stylex.ts`, Panda
      # or a v3 `tailwind.config`, so glob liveness against any root reports
      # fourteen dead globs for dialects and CSS-in-JS conventions the rule
      # correctly covers. Per the reasoning above, an extension glob for a
      # stylesheet dialect cannot be a typo. The residual risk is a mistyped
      # *convention* glob (`*.styles.ts` and friends); those are listed in the
      # rule's own glob rationale, so a reviewer can read them against the file.
      - "{{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py rules/css-theming.md rules/css-theming"
      #
      # The guard probes for CONTENT, not for the directory: `..` always
      # exists, so `-d` would never fall through and CI would report every
      # TypeScript glob as dead against a runner's parent directory.
      - |
        if [ -d "{{.TS_CONSUMER}}" ] && [ -n "$(find "{{.TS_CONSUMER}}" -name '*.ts' -not -path '*/node_modules/*' -not -path '*/.agents/*' -print -quit 2>/dev/null)" ]; then
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --root {{.TS_CONSUMER}} --allow-absent '**/npm-shrinkwrap.json' rules/typescript-quality.md rules/typescript-packaging.md
        else
          echo "note: no TypeScript under {{.TS_CONSUMER}} — glob liveness NOT checked for typescript; run locally against a tree containing TypeScript"
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py rules/typescript-quality.md rules/typescript-packaging.md
        fi
      #
      # Docs is checked WITHOUT a root too, mirroring the CSS reasoning above.
      # `docs-quality`'s glob set names directory shapes and generator config
      # filenames (`docs/**`, `website/**`, `mkdocs.yml`, `.vitepress/config.*`
      # and the rest), not one file extension. No root, not this repo and not
      # the fleet, carries every one of those generators at once, so checking
      # against a root would report several dead globs for generators the rule
      # correctly covers. A directory-shaped or config-filename glob cannot be
      # a typo, the same reasoning the CSS step above already applies.
      - "{{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py rules/docs-quality.md skills/docs-plan skills/docs-instrument"
      #
      # The JVM set is checked WITHOUT a root, for the same reason as CSS and
      # docs: the fleet holds no Java or Kotlin, so every source glob would read
      # as dead against `..` and every build-file glob against `../ocx`. The
      # set was grounded on an exemplar corpus of upstream JVM repositories
      # instead (see `.agents/research/jvm-frame.md`), and an extension glob
      # for a language cannot be a typo. A rule .md path covers its support
      # directory, so the four indexes are enough.
      - "{{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py rules/java-quality.md rules/kotlin-quality.md rules/gradle-build.md rules/maven-build.md skills/jvm-release skills/jvm-dependency-triage"
      #
      # The Go set follows the JVM reasoning: the fleet holds no Go, so there
      # is no consumer to resolve globs against in CI. It was grounded on an
      # upstream exemplar corpus instead (see `.agents/research/go-frame.md`).
      # Set GO_CONSUMER to a Go module checkout (the research used ko) to also
      # check glob liveness; the allow-absent names are correct globs that a
      # single-module repository without a workspace, a dotless goreleaser
      # config or a `.yml` (not `.yaml`) golangci config does not carry. Each
      # one matched at least one repository in the exemplar corpus except
      # `.config/goreleaser.*`, which goreleaser itself reads by name.
      - |
        if [ -n "{{.GO_CONSUMER}}" ] && [ -f "{{.GO_CONSUMER}}/go.mod" ]; then
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --root {{.GO_CONSUMER}} --forbid '/home/mherwig' --forbid '.agents/research' --allow-absent '**/go.work' --allow-absent '**/go.work.sum' --allow-absent '**/*golangci*.yml' --allow-absent '**/goreleaser*.yml' --allow-absent '**/goreleaser*.yaml' --allow-absent '**/.config/goreleaser.*' --allow-absent '**/staticcheck.conf' rules/go-quality.md rules/go-modules.md skills/go-release skills/go-upgrade skills/go-diagnose
        else
          echo "note: GO_CONSUMER unset — glob liveness NOT checked for go; set it to a Go module checkout to include it"
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --forbid '/home/mherwig' --forbid '.agents/research' rules/go-quality.md rules/go-modules.md skills/go-release skills/go-upgrade skills/go-diagnose
        fi
      #
      # The Nix set follows the Go reasoning: the fleet holds no Nix, so glob
      # liveness needs an outside tree. It was grounded on an upstream exemplar
      # corpus (see `.agents/research/nix-frame.md`); nix-community/disko
      # carries all three globbed names (`*.nix`, `flake.lock`, `statix.toml`).
      # Set NIX_CONSUMER to a flake checkout to also check glob liveness.
      - |
        if [ -n "{{.NIX_CONSUMER}}" ] && [ -f "{{.NIX_CONSUMER}}/flake.nix" ]; then
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --root {{.NIX_CONSUMER}} --forbid '/home/mherwig' --forbid '.agents/research' rules/nix-quality.md skills/nix-flake-adopt skills/nix-flake-release skills/nix-diagnose
        else
          echo "note: NIX_CONSUMER unset — glob liveness NOT checked for nix; set it to a flake checkout to include it"
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --forbid '/home/mherwig' --forbid '.agents/research' rules/nix-quality.md skills/nix-flake-adopt skills/nix-flake-release skills/nix-diagnose
        fi
      #
      # The Swift set follows the Go reasoning: the fleet holds no Swift, so
      # glob liveness needs an outside tree. It was grounded on a 40-repo
      # upstream exemplar corpus (see `.agents/research/swift-frame.md`);
      # apple/containerization carries Package.swift, Package.resolved,
      # .swift-format, .swift-version and .spi.yml. The allow-absent names are
      # correct globs that tree lacks but other exemplars carry (swiftly,
      # tuist, swift-async-algorithms), plus the depth files' never-matching
      # on-demand globs. Set SWIFT_CONSUMER to a SwiftPM checkout to also check
      # glob liveness.
      - |
        if [ -n "{{.SWIFT_CONSUMER}}" ] && [ -f "{{.SWIFT_CONSUMER}}/Package.swift" ]; then
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --root {{.SWIFT_CONSUMER}} --forbid '/home/mherwig' --forbid '.agents/research' --allow-absent '**/.swiftformat' --allow-absent '**/.swiftlint.yml' --allow-absent '**/Package@swift-*.swift' --allow-absent '**/.swift-quality-depth-on-demand' --allow-absent '**/.swift-package-depth-on-demand' rules/swift-quality.md rules/swift-package.md skills/swift-upgrade skills/swift-diagnose skills/swift-release
        else
          echo "note: SWIFT_CONSUMER unset — glob liveness NOT checked for swift; set it to a SwiftPM checkout to include it"
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --forbid '/home/mherwig' --forbid '.agents/research' rules/swift-quality.md rules/swift-package.md skills/swift-upgrade skills/swift-diagnose skills/swift-release
        fi
      #
      # Every checks/*.py script carries its own fixtures and its own
      # --self-test mode. Run all eight here, so a broken check is caught next
      # to the artifact validation above, not only the first time a real page
      # hits it.
      - |
        for s in rules/docs-quality/checks/*.py; do
          {{.PY}} "$s" --self-test || exit 1
        done
      #
      # Dogfood: this rule set is held to the plain-English limits it
      # prescribes, run over its own index, its depth files, both skills and
      # their own description companions. Findings fail the task.
      # Named files, not the directory: `rules/docs-quality/checks/fixtures/`
      # holds planted violations by design, and a directory walk would report
      # every one of them as a finding against the rule set.
      - "{{.PY}} rules/docs-quality/checks/prose.py rules/docs-quality.md rules/docs-quality/*.md skills/docs-plan/SKILL.md skills/docs-plan/references/*.md skills/docs-instrument/SKILL.md skills/docs-instrument/references/*.md docs/docs-*.md"
      #
      # Bazel is checked against a single Bazel consumer (`../rules_ocx` by
      # default), the same way Rust is. The glob set is the fifteen names the
      # build system guarantees, so liveness is meaningful — but six of them
      # are correct and absent from any Bzlmod-only tree: `BUILD` (the fleet
      # uses `BUILD.bazel`), the three legacy `WORKSPACE*` names the rule
      # exists to catch, `REPO.bazel`, and `*.scl` (PROJECT.scl is unadopted).
      # `*.star` matches nothing in rules_ocx and 150+ files across the fleet's
      # mirrors, so it is allowed-absent here rather than validated against a
      # root that happens to carry Starlark scripts. `--forbid` keeps a
      # workstation path, the fleet's cache host and a corpus link out of a
      # shareable artifact; a bare '/home/' would flag the rules that tell the
      # reader to grep for hardcoded home paths.
      - |
        if [ -d "{{.BAZEL_CONSUMER}}" ] && [ -f "{{.BAZEL_CONSUMER}}/MODULE.bazel" ]; then
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --root {{.BAZEL_CONSUMER}} --forbid '/home/mherwig' --forbid 'bazel-cache.ocx.sh' --forbid '.agents/research' --allow-absent '**/BUILD' --allow-absent '**/WORKSPACE' --allow-absent '**/WORKSPACE.bazel' --allow-absent '**/WORKSPACE.bzlmod' --allow-absent '**/REPO.bazel' --allow-absent '**/*.scl' --allow-absent '**/*.star' rules/bazel-quality.md skills/bazel-adopt skills/bazel-diagnose
        else
          echo "note: no Bazel consumer at {{.BAZEL_CONSUMER}} — glob liveness NOT checked for bazel; run locally against a Bzlmod repository"
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --forbid '/home/mherwig' --forbid 'bazel-cache.ocx.sh' --forbid '.agents/research' rules/bazel-quality.md skills/bazel-adopt skills/bazel-diagnose
        fi
      #
      # The CMake set is checked WITHOUT a root, like the JVM set: the fleet
      # holds one CMake module and no Conan or vcpkg manifest, so most globs
      # would read as dead against any fleet repository. The set was grounded
      # on an exemplar corpus of 46 upstream C and C++ repositories instead
      # (see `.agents/research/cmake-frame.md`), where every glob but three
      # (`.gersemirc`, `conan.lock`, `conanws.*`, correct and unadopted)
      # resolves. `--forbid` keeps workstation paths, the corpus, and the
      # anonymised fleet module's names out of a shareable artifact.
      - "{{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --forbid '/home/mherwig' --forbid '.agents/research' --forbid 'research-lang/exemplars' --forbid 'find_ocx' --forbid 'ocx.sh/' --forbid 'ocx.lock' rules/cmake-build.md rules/cpp-packaging.md skills/cmake-dependency-triage skills/cmake-modernize"
      #
      # The code-comments set is checked WITHOUT a root, for the CSS and JVM
      # reason: it globs one extension per language across a dozen languages,
      # an extension glob for a language cannot be a typo, and no single tree
      # carries every one of them. The rule .md path covers its support
      # directory, fixtures included. `--forbid` keeps workstation paths and
      # the research corpus out of a shareable artifact.
      - "{{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --forbid '/home/mherwig' --forbid '.agents/research' rules/code-docs.md skills/code-docs-cleanup"
      #
      # Its checks carry their own fixtures and --self-test, like docs-quality's
      # above. The cleanup skill's gate is one of them, and a broken one passes
      # the cleanups it exists to fail.
      - |
        for s in rules/code-docs/checks/*.py; do
          {{.PY}} "$s" --self-test || exit 1
        done
    vars:
      CONSUMER: '{{.CONSUMER | default "../ocx"}}'
      # The fleet root, not a single repo — see the comment above.
      TS_CONSUMER: '{{.TS_CONSUMER | default ".."}}'
      BAZEL_CONSUMER: '{{.BAZEL_CONSUMER | default "../rules_ocx"}}'
      # No default: the fleet has no Go module to point at.
      GO_CONSUMER: '{{.GO_CONSUMER | default ""}}'
      # No default: the fleet has no flake to point at.
      NIX_CONSUMER: '{{.NIX_CONSUMER | default ""}}'
      # No default: the fleet has no SwiftPM package to point at.
      SWIFT_CONSUMER: '{{.SWIFT_CONSUMER | default ""}}'

  build:
    desc: Build every publishable artifact without pushing anything
    cmds:
      - grim publish --dry-run

  # Informational, NOT a gate — it is in no task's dependency list, and it is
  # expected to exit non-zero. `index.config.json` sets `allowManualEdits`
  # because `publish.yml` needs a hand-edited `contents: write`, so that one
  # file reports drift by design. Read the diff when upgrading grim-indexer:
  # any file *other* than publish.yml drifting is a real finding.
  ci:check:
    desc: "Show how the generated CI files differ from index.config.json (publish.yml drifts by design)"
    cmds:
      - npm run ci:check

  # What CI can run: no `grim` on the runner, so `build` is local-only. The
  # `validate` workflow that grim-indexer generates is what covers the build
  # side on a push.
  ci:
    desc: Everything the CI gate runs
    cmds:
      - task: lint
      - task: format:check
      - task: test
      - task: selftest
      - task: artifacts

  verify:
    desc: The full local gate — `ci` plus the artifact build
    cmds:
      - task: ci
      - task: build
