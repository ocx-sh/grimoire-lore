# Every tool this repository needs is pinned in `ocx.toml` and resolved through
# `ocx run <tool> -- <argv>`, so a contributor and CI run the same version of
# ruff and the same version of uv. Nothing here reaches for a floating release
# or expects a tool to be on PATH already — that is the whole point of pinning.
#
#     ocx run task -- task            # list what is available
#     ocx run task -- task verify     # everything the CI gate runs
version: "3"

silent: true

vars:
  # The scripts declare `requires-python = ">=3.11"` in their PEP 723 headers.
  # Running the floor is what makes that declaration true rather than
  # aspirational: newer-only syntax fails here, not at a consumer.
  PY: python3

tasks:
  default:
    desc: List the available tasks
    cmds:
      - ocx run task -- task --list

  lint:
    desc: Lint every Python file with the pinned ruff
    cmds:
      - ocx run ruff -- ruff check --output-format {{.RUFF_FORMAT | default "concise"}} .

  lint:fix:
    desc: Apply ruff's safe fixes
    cmds:
      - ocx run ruff -- ruff check --fix .

  format:
    desc: Format every Python file
    cmds:
      - ocx run ruff -- ruff format .

  format:check:
    desc: Fail when a Python file is not formatted
    cmds:
      - ocx run ruff -- ruff format --check .

  test:
    desc: Run the Python test suite (stdlib unittest, no runner to install)
    cmds:
      - "{{.PY}} -m unittest discover -s tests {{.UNITTEST_ARGS}}"

  # The validator also carries its own `--self-test`, which needs nothing
  # installed. It can regress while the suite above still passes, so it is a
  # separate gate rather than a step inside it.
  selftest:
    desc: Run the validator's own self-test
    cmds:
      - "{{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --self-test"

  artifacts:
    desc: Validate the rules and bundle against the artifact contract
    cmds:
      # `--root` must point at a repository that actually contains the language
      # being checked: this catalog holds no Rust, so glob liveness is
      # meaningless against `.` and every scoped rule would read as dead.
      #
      # ONE root cannot serve a polyglot catalog. `../ocx` carries Rust and the
      # Python harnesses, but no TypeScript at all — validating the TS rules
      # against it reports every one of their globs as dead. The TypeScript set
      # is deliberately checked against the *fleet* root instead, because its
      # globs span shapes no single repository has: `.tsx` lives only in the
      # React app, `.mts` only in a VitePress site, `biome.jsonc` only in the
      # one Biome repo. An extension glob for the language itself cannot be a
      # typo, so a narrower root would only manufacture findings.
      #
      # CI has no consumer checked out. Rather than fail or — worse — quietly
      # pass a check that never ran, drop only the glob check and say so.
      - |
        if [ -d "{{.CONSUMER}}" ]; then
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --root {{.CONSUMER}} rules/rust-quality.md rules/rust-cargo.md rules/python-quality.md rules/python-packaging.md .claude/skills/research-lang
        else
          echo "note: no consumer at {{.CONSUMER}} — glob liveness NOT checked for rust/python; run locally against a Rust repo"
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py rules/rust-quality.md rules/rust-cargo.md rules/python-quality.md rules/python-packaging.md .claude/skills/research-lang
        fi
      - |
        if [ -d "{{.TS_CONSUMER}}" ]; then
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py --root {{.TS_CONSUMER}} rules/typescript-quality.md rules/typescript-packaging.md
        else
          echo "note: no consumer at {{.TS_CONSUMER}} — glob liveness NOT checked for typescript; run locally against a tree containing TypeScript"
          {{.PY}} .claude/skills/research-lang/scripts/check-artifacts.py rules/typescript-quality.md rules/typescript-packaging.md
        fi
    vars:
      CONSUMER: '{{.CONSUMER | default "../ocx"}}'
      # The fleet root, not a single repo — see the comment above.
      TS_CONSUMER: '{{.TS_CONSUMER | default ".."}}'

  build:
    desc: Build every publishable artifact without pushing anything
    cmds:
      - grim publish --dry-run

  # Informational, NOT a gate — it is in no task's dependency list, and it is
  # expected to exit non-zero. `index.config.json` sets `allowManualEdits`
  # because `publish.yml` needs a hand-edited `contents: write`, so that one
  # file reports drift by design. Read the diff when upgrading grim-indexer:
  # any file *other* than publish.yml drifting is a real finding.
  ci:check:
    desc: "Show how the generated CI files differ from index.config.json (publish.yml drifts by design)"
    cmds:
      - npm run ci:check

  # What CI can run: no `grim` on the runner, so `build` is local-only. The
  # `validate` workflow that grim-indexer generates is what covers the build
  # side on a push.
  ci:
    desc: Everything the CI gate runs
    cmds:
      - task: lint
      - task: format:check
      - task: test
      - task: selftest
      - task: artifacts

  verify:
    desc: The full local gate — `ci` plus the artifact build
    cmds:
      - task: ci
      - task: build
