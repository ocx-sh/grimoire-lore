# `grim publish` manifest - this repo holds both its own skills (under
# `skills/`) and the index that lists them, the combined layout
# `grim-indexer init --with-skills` scaffolds.
#
# The default layout is a standalone index repo instead: an index is a
# distribution database that N separate skill repos announce into. Use
# this combined form when one team owns both sides.
#
# Publish with `grim publish`, then announce into this index. Schema:
# `grim schema --kind publish`.
registry = "ghcr.io"
# Flat: every artifact publishes as ghcr.io/ocx-sh/lore/<name>, whatever its
# kind. The conventional {skills,rules,agents,bundles}/ segment is a namespace
# partition, not a type tag — kind travels in the manifest as
# `com.grimoire.kind`. Our names are unique across kinds, so the segment would
# only lengthen every reference. Decided before the first publish, because a
# repository path is public the moment it lands in someone's grimoire.lock.
repository_prefix = "ocx-sh/lore"

# NO CATALOG-WIDE `version`. Each entry carries its own, because publishing is
# triggered by a push to `main` and `grim publish` skips a version already in
# the registry — so the version key IS the release lever, and one shared key
# means every package re-releases whenever any one of them changes. That
# republishes unchanged bytes under a new tag, and it makes a consumer's
# `grimoire.lock` churn for packages that did not move.
#
# Omitting the top-level key is deliberate rather than an oversight: with no
# fallback, a new entry that forgets its `version` fails the manifest instead
# of silently inheriting a number nobody chose for it.
#
# To release: bump the `version` of the entries whose content changed, and
# only those. A bundle is content too — bump it when its member SET changes,
# not when a member's own version does, since members are named without tags.

# Where `grim publish --announce` opens its PR/MR. This repo *is* the index,
# so it announces into itself. Never drop these keys: with no `[announce]`
# table grim falls back to the public first-party index
# (`github.com/grimoire-rs/index`) and proposes your packages into a repo you
# do not own.
#
# `repository` is this repo's https clone URL. `namespace` is the
# `index/<host>/<namespace>/` your entries land under - the contribution gate
# refuses a namespace whose forge owner is not you. A literal `REPLACE-ME`
# means the scaffold had nothing to derive it from: `--announce` then stops
# with "cannot derive the index host" rather than announcing anywhere.
[announce]
repository = "https://github.com/ocx-sh/grimoire-lore"
namespace = "ocx-sh"

# One table per package. `repository_prefix` above supplies the path, so an
# entry needs nothing but its name. Do not set a per-entry `repository` — it
# is used verbatim and would reintroduce a kind segment.
#
# [skills.example]                 # → ghcr.io/ocx-sh/lore/example
# [bundles.essentials]             # → ghcr.io/ocx-sh/lore/essentials
#
# Flat bundles name members same-directory: `./example:0`, not
# `../skills/example:0`.
#
# Conventional source paths, used when an entry sets no `path`:
# `skills/<name>/`, `rules/<name>.md`, `agents/<name>.md`, `bundles/<name>.toml`.
# A rule's sibling `rules/<name>/` support directory is discovered automatically
# and ships in the same layer.
#
# Publish order is fixed by kind (skills → rules → agents → mcp → bundles), so
# `rust-essentials` always lands after the members it references.

# The Rust quality set. `rust-quality` is the index rule; its support directory
# carries the depth files it routes to.
# Description companions - what `grim describe` prints and what the index site
# renders for each package.
#
# WITHOUT these, grim falls back to a conventional probe: it finds the repo
# `README.md` and fans the identical payload to every entry. That shipped once
# - all three companions had the same digest, and all three described the
# *index* ("OCX lore, a Grimoire package index") rather than the artifact
# someone had just installed.
#
# A per-entry table REPLACES the top-level one rather than merging with it, so
# each repeats `logo`. Paths are manifest-relative; well-known members are
# renamed on the wire (`readme` -> `README.md`, `logo` -> `logo.<ext>`), which
# is why the sources can live under `docs/` and `assets/`.
[description]
readme = "README.md"
logo = "assets/lore-rust.svg"

[rules.rust-quality]
version = "0.1.0"
description = { readme = "docs/rust-quality.md", logo = "assets/lore-rust.svg" }

[rules.rust-cargo]
version = "0.1.0"
description = { readme = "docs/rust-cargo.md", logo = "assets/lore-rust.svg" }

[bundles.rust-essentials]
version = "0.1.0"
description = { readme = "docs/rust-essentials.md", logo = "assets/lore-rust.svg" }

# The Python quality set. `python-quality` is the index rule; its support
# directory carries the twelve depth files it routes to. `python-packaging`
# is a separate rule only because its glob genuinely differs — it loads on
# manifests and lockfiles, not on source.
[rules.python-quality]
version = "0.1.0"
description = { readme = "docs/python-quality.md", logo = "assets/lore-python.svg" }

[rules.python-packaging]
version = "0.1.0"
description = { readme = "docs/python-packaging.md", logo = "assets/lore-python.svg" }

[bundles.python-essentials]
version = "0.1.0"
description = { readme = "docs/python-essentials.md", logo = "assets/lore-python.svg" }
